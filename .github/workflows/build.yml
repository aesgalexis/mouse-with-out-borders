name: Build Windows app and installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -match '^v\d+\.\d+\.\d+$') {
            $version = "${{ github.ref_name }}".Substring(1)
          } else {
            [xml]$project = Get-Content 'MouseWithOutBorders/MouseWithOutBorders.csproj'
            $version = [string]$project.Project.PropertyGroup.Version
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate PowerShell installer scripts
        shell: pwsh
        run: |
          foreach ($script in @("scripts/install.ps1", "scripts/uninstall.ps1", "scripts/generate-icon.ps1", "tests/Installer.SmokeTests.ps1")) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) { throw "PowerShell parser errors in $script : $errors" }
          }

      - name: Generate application icon
        shell: pwsh
        run: |
          ./scripts/generate-icon.ps1 ./MouseWithOutBorders/assets/app.ico

      - name: Restore and compile
        shell: pwsh
        run: |
          dotnet restore MouseWithOutBorders/MouseWithOutBorders.csproj -r win-x64
          dotnet build MouseWithOutBorders/MouseWithOutBorders.csproj -c Release -r win-x64 --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test LAN pairing and mouse packets
        shell: pwsh
        run: dotnet run --project tests/MousePeer.SmokeTests/MousePeer.SmokeTests.csproj --configuration Release

      - name: Test manual GitHub updater
        shell: pwsh
        run: dotnet run --project tests/Updater.SmokeTests/Updater.SmokeTests.csproj --configuration Release

      - name: Test local keyboard remapping
        shell: pwsh
        run: dotnet run --project tests/Keyboard.SmokeTests/Keyboard.SmokeTests.csproj --configuration Release

      - name: Test pairing setup UI
        shell: pwsh
        run: dotnet run --project tests/Pairing.UiTests/Pairing.UiTests.csproj --configuration Release

      - name: Publish portable executable
        shell: pwsh
        run: |
          dotnet publish MouseWithOutBorders/MouseWithOutBorders.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false -p:Version=${{ steps.version.outputs.version }} -o dist/app

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/portable -Force | Out-Null
          Compress-Archive -Path dist/app/MouseWithOutBorders.exe -DestinationPath dist/portable/MouseWithOutBorders-${{ steps.version.outputs.version }}-Portable.zip

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "/DAppVersion=${{ steps.version.outputs.version }}" "installer\MouseWithOutBorders.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test installation, running-app upgrades and uninstall
        timeout-minutes: 5
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem "dist/installer/*-Setup.exe") | Select-Object -First 1
          if (-not $installer) { throw "Setup.exe was not produced" }
          $legacy = 'dist/MouseWithOutBorders-0.1.2-Portable.zip'
          Write-Host 'Downloading the legacy upgrade fixture (60 second timeout).'
          Invoke-WebRequest -Uri 'https://github.com/aesgalexis/mouse-without-borders/releases/download/v0.1.2/MouseWithOutBorders-0.1.2-Portable.zip' -OutFile $legacy -TimeoutSec 60
          if ((Get-FileHash -LiteralPath $legacy -Algorithm SHA256).Hash -ine '876f9d244fe80d3cc81e0ff305533df4ea5e207ac8584db71b328d9bc856f4c3') {
            throw 'Legacy test fixture checksum mismatch.'
          }
          ./tests/Installer.SmokeTests.ps1 -InstallerPath $installer.FullName -LegacyPortablePath $legacy

      - name: Upload installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MouseWithOutBorders-Installer-Logs
          path: dist/installer-tests/*.log
          if-no-files-found: ignore

      - name: Generate release checksums
        shell: pwsh
        run: |
          $output = 'dist/SHA256SUMS.txt'
          $assets = Get-ChildItem "dist/installer/*-Setup.exe", "dist/portable/*-Portable.zip"
          foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($asset.Name)" | Add-Content -Path $output -Encoding utf8
          }
          Get-Content $output

      - name: Upload installer and portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MouseWithOutBorders-Windows-x64
          path: |
            dist/installer/*-Setup.exe
            dist/portable/*-Portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create preview release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $releaseExists = $false
          try {
            $releaseInfo = gh release view "$tag" --repo "${{ github.repository }}" --json tagName 2>$null
            $releaseExists = ($LASTEXITCODE -eq 0)
          } catch { $releaseExists = $false }
          if ($releaseExists) {
            Write-Host "Release $tag already exists. Not replacing published downloads."
            exit 0
          }
          $assets = @(Get-ChildItem "dist/installer/*-Setup.exe" | Select-Object -ExpandProperty FullName)
          $assets += @(Get-ChildItem "dist/portable/*-Portable.zip" | Select-Object -ExpandProperty FullName)
          $assets += @(Resolve-Path "dist/SHA256SUMS.txt" | Select-Object -ExpandProperty Path)
          $notesPath = "docs/releases/$tag.md"
          $notesArgs = if (Test-Path -LiteralPath $notesPath) { @('--notes-file', $notesPath) } else { @('--generate-notes') }
          gh release create "$tag" $assets --repo "${{ github.repository }}" --target "$env:GITHUB_SHA" --title "Mouse, with out borders $tag" --prerelease @notesArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/*-Setup.exe
            dist/portable/*-Portable.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: true
