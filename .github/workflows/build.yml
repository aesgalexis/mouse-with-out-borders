name: Windows build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build MouseWithOutBorders/MouseWithOutBorders.csproj --configuration Release
      - name: Publish portable executable
        run: dotnet publish MouseWithOutBorders/MouseWithOutBorders.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --output publish
      - uses: actions/upload-artifact@v4
        with:
          name: mouse-with-out-borders-win-x64
          path: publish/MouseWithOutBorders.exe
