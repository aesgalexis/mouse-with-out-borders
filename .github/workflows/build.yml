name: Build Windows app and installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -match '^v\d+\.\d+\.\d+$') {
            $version = "${{ github.ref_name }}".Substring(1)
          } else {
            $version = "0.1.0"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Generate application icon
        shell: pwsh
        run: |
          ./scripts/generate-icon.ps1 ./MouseWithOutBorders/assets/app.ico

      - name: Restore and compile
        shell: pwsh
        run: |
          dotnet restore MouseWithOutBorders/MouseWithOutBorders.csproj -r win-x64
          dotnet build MouseWithOutBorders/MouseWithOutBorders.csproj -c Release -r win-x64 --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Publish portable executable
        shell: pwsh
        run: |
          dotnet publish MouseWithOutBorders/MouseWithOutBorders.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false -p:Version=${{ steps.version.outputs.version }} -o dist/app

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/portable -Force | Out-Null
          Compress-Archive -Path dist/app/MouseWithOutBorders.exe -DestinationPath dist/portable/MouseWithOutBorders-${{ steps.version.outputs.version }}-Portable.zip

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "/DAppVersion=${{ steps.version.outputs.version }}" "installer\MouseWithOutBorders.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer and portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MouseWithOutBorders-Windows-x64
          path: |
            dist/installer/*-Setup.exe
            dist/portable/*-Portable.zip
          if-no-files-found: error

      - name: Publish release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/*-Setup.exe
            dist/portable/*-Portable.zip
          generate_release_notes: true
